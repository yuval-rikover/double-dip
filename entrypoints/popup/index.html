<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Double Dip</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Double Dip</h1>

      <section id="access" class="access" hidden>
        <p>The extension needs access to the bundle sites, Steam, GOG, Epic and IsThereAnyDeal to add links and check your libraries.</p>
        <button id="grant" type="button">Allow access</button>
      </section>

      <h2>Your libraries</h2>
      <ul id="stores" class="stores" aria-live="polite"></ul>

      <button id="refresh" type="button">Refresh libraries</button>

      <footer>
        Game IDs matched via <a href="https://isthereanydeal.com/" target="_blank" rel="noopener">IsThereAnyDeal</a>.
        Not affiliated with IsThereAnyDeal, Valve, GOG, Epic Games, Humble Bundle, Fanatical or Green Man Gaming.
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
